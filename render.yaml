# Render Blueprint — backend web service (Docker) + frontend static site.
# Deploy: Render Dashboard -> New -> Blueprint -> select this repo.
# Then set LLM_API_KEYS (and optionally JWT_SECRET) in the backend
# service's Environment tab. The frontend static site builds with
# VITE_API_URL pointing at the backend service's URL.
services:
  - type: web
    name: career-guidance-v2
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://career-guidance-v2-backend.onrender.com
  - type: web
    name: career-guidance-v2-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/career_guidance.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
